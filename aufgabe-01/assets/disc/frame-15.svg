    />

    <circle
        cx="155"
        cy="330"
        r="8"
        fill="#777777"
    />


    <!-- kleiner Balken -->

    <rect
        x="130"
        y="175"
        width="55"
        height="12"
        rx="3"
        fill="#1f1f1f"
    />


    <!-- Außenmarkierungen -->

    <g
        stroke="#555555"
        stroke-width="4"
