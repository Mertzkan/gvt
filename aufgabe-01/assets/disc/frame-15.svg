    />


    <!-- diagonale Achsen -->

    <line
        x1="133"
        y1="133"
        x2="367"
        y2="367"
        stroke="#e2e2e2"
        stroke-width="2"
    />

    <line
        x1="367"
        y1="133"
        x2="133"
        y2="367"
        stroke="#e2e2e2"
