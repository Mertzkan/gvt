        <line x1="300.47" y1="61.64" x2="297.88" y2="71.30" stroke-width="1.5" />
        <line x1="347.50" y1="81.13" x2="342.50" y2="89.79" stroke-width="1.5" />
        <line x1="387.89" y1="112.11" x2="375.87" y2="124.13" stroke-width="3" />
        <line x1="418.87" y1="152.50" x2="410.21" y2="157.50" stroke-width="1.5" />
        <line x1="438.36" y1="199.53" x2="428.70" y2="202.12" stroke-width="1.5" />
        <line x1="445.00" y1="250.00" x2="428.00" y2="250.00" stroke-width="3" />
        <line x1="438.36" y1="300.47" x2="428.70" y2="297.88" stroke-width="1.5" />
        <line x1="418.87" y1="347.50" x2="410.21" y2="342.50" stroke-width="1.5" />
        <line x1="387.89" y1="387.89" x2="375.87" y2="375.87" stroke-width="3" />
        <line x1="347.50" y1="418.87" x2="342.50" y2="410.21" stroke-width="1.5" />
        <line x1="300.47" y1="438.36" x2="297.88" y2="428.70" stroke-width="1.5" />
        <line x1="250.00" y1="445.00" x2="250.00" y2="428.00" stroke-width="3" />
        <line x1="199.53" y1="438.36" x2="202.12" y2="428.70" stroke-width="1.5" />
        <line x1="152.50" y1="418.87" x2="157.50" y2="410.21" stroke-width="1.5" />
        <line x1="112.11" y1="387.89" x2="124.13" y2="375.87" stroke-width="3" />
        <line x1="81.13" y1="347.50" x2="89.79" y2="342.50" stroke-width="1.5" />
        <line x1="61.64" y1="300.47" x2="71.30" y2="297.88" stroke-width="1.5" />
        <line x1="55.00" y1="250.00" x2="72.00" y2="250.00" stroke-width="3" />
        <line x1="61.64" y1="199.53" x2="71.30" y2="202.12" stroke-width="1.5" />
        <line x1="81.13" y1="152.50" x2="89.79" y2="157.50" stroke-width="1.5" />
