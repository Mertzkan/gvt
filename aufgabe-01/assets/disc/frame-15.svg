        <line x1="250" y1="55" x2="250" y2="75" />

        <line x1="445" y1="250" x2="425" y2="250" />

        <line x1="250" y1="445" x2="250" y2="425" />

        <line x1="55" y1="250" x2="75" y2="250" />

    </g>


    <!-- kleinere Markierungen -->

    <g
        stroke="#999999"
