    >

        <line x1="388" y1="112" x2="374" y2="126" />

        <line x1="388" y1="388" x2="374" y2="374" />

        <line x1="112" y1="388" x2="126" y2="374" />

        <line x1="112" y1="112" x2="126" y2="126" />

