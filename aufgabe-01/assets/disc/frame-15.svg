    />


    <!-- Mittelpunkt -->

    <circle
        cx="250"
        cy="250"
        r="18"
        fill="#1f5fa8"
    />


    <!-- Hauptrichtungsanzeiger -->

    <path
        d="
            M 250 70
            L 232 110
            L 268 110
            Z
        "
